name: WGD Live Conformance

on:
  push:
    branches:
      - main
    paths:
      - .release/live-conformance
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run live WGD Protocol v0.1 conformance
        run: node packages/conformance/cli.mjs https://wgd-dev-alpha.vercel.app/api/wgd
      - name: Record conformance success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"wgd-live-conformance","description":"Live resolver passes WGD Protocol v0.1 conformance"}'
