name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish under
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - latest
  push:
    branches: [main]
    paths:
      - .release/alpha3

permissions:
  id-token: write
  contents: read

env:
  NPM_TAG: ${{ inputs.tag || 'alpha' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm install
      - run: npm run build
      - run: npm run typecheck

      - name: Publish core
        run: npm publish --workspace @wgd-ai/core --tag "$NPM_TAG" --access public

      - name: Publish icons
        run: npm publish --workspace @wgd-ai/icons --tag "$NPM_TAG" --access public

      - name: Publish react
        run: npm publish --workspace @wgd-ai/react --tag "$NPM_TAG" --access public

      - name: Publish conformance
        run: npm publish --workspace @wgd-ai/conformance --tag "$NPM_TAG" --access public
