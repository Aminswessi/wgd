name: WGD CI

on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    name: Build and protocol checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Validate schemas
        run: node -e "for (const f of require('fs').readdirSync('schema')) if (f.endsWith('.json')) JSON.parse(require('fs').readFileSync('schema/'+f,'utf8')); console.log('schemas: parse PASS')"
      - name: Protocol smoke test
        run: node scripts/protocol-smoke.mjs
