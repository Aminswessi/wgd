name: WGD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and protocol checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Runtime versions
        run: |
          node --version
          npm --version
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Validate schemas
        run: node -e "for (const f of require('fs').readdirSync('schema')) if (f.endsWith('.json')) JSON.parse(require('fs').readFileSync('schema/'+f,'utf8')); console.log('schemas: parse PASS')"
      - name: Protocol smoke test
        run: node scripts/protocol-smoke.mjs
