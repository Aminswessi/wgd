name: Verify WGD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install
      - run: npm run build
      - run: npm run typecheck
      - name: Validate JSON schemas
        run: node -e "for (const f of require('fs').readdirSync('schema')) if (f.endsWith('.json')) JSON.parse(require('fs').readFileSync('schema/'+f,'utf8')); console.log('schemas: parse PASS')"
      - name: Protocol smoke test
        run: node scripts/protocol-smoke.mjs
